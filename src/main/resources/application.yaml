spring:
  application:
    name: cyfryzacja
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  upload:
    max-size-bytes: 10485760
  edenai:
    chat-url: https://api.edenai.run/v3/chat/completions
    ocr-url: https://api.edenai.run/v3/universal-ai
    default-model: google/gemma-4-31b-it
  jwt:
    secret: ${JWT_SECRET:public-formforge-local-secret-32chars}
    issuer: ${JWT_ISSUER:formforge}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
