spring:
  application:
    name: cyfryzacja
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:20}MB
      max-request-size: ${MAX_UPLOAD_MB:20}MB
app:
  upload:
    max-size-mb: ${MAX_UPLOAD_MB:20}
  ai:
    provider: ${AI_PROVIDER:eden}
    eden-model: ${EDENAI_MODEL:ovhcloud/Qwen3.5-9B}
    eden-max-output-tokens: ${EDENAI_MAX_OUTPUT_TOKENS:8192}
    local-model: ${LOCAL_AI_MODEL:qwen3.5:9b}
    local-base-url: ${LOCAL_AI_BASE_URL:http://localhost:11434}
  jwt:
    secret: ${JWT_SECRET:public-formforge-local-secret-32chars}
    issuer: ${JWT_ISSUER:formforge}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
