services:
  app:
    build: .
    image: formforge:0.0.1
    user: "10001:10001"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?ustaw JWT_SECRET w .env}
      JWT_ISSUER: ${JWT_ISSUER:-formforge}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MAX_UPLOAD_MB:-20}MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MAX_UPLOAD_MB:-20}MB
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped
    networks: [frontend]

  # Opcjonalny lokalny LLM (docker compose --profile llm up). Obraz i wagi do dobrania
  # (przypięty tag+digest, licencja bez copyleftu) – celowo bez "ports" i w sieci internal.
  # llm:
  #   image: <obraz>@sha256:<digest>
  #   profiles: [llm]
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   read_only: true
  #   networks: [backend]

networks:
  frontend: {}
  backend:
    internal: true
