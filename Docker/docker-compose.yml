# Uruchomienie z korzenia repo: docker compose --env-file .env -f Docker/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: formforge:0.0.1
    user: "10001:10001"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      EDENAI_API_KEY: ${EDENAI_API_KEY:?ustaw EDENAI_API_KEY w .env}
      JWT_ISSUER: ${JWT_ISSUER:-formforge}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MAX_UPLOAD_MB:-20}MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MAX_UPLOAD_MB:-20}MB
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,uid=10001,gid=10001
    # Brak interaktywnego dostępu do kontenera
    tty: false
    stdin_open: false
    # Wszystkie capabilities usunięte; bez cap_add (port 8080 > 1024 nie wymaga NET_BIND_SERVICE)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    init: true
    restart: unless-stopped
    # Limit logów (ochrona przed "logging bomb"): max 3 pliki x 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [frontend]

  # Opcjonalny lokalny LLM (docker compose --profile llm up). Obraz i wagi do dobrania
  # (przypięty tag+digest, licencja bez copyleftu) – celowo bez "ports" i w sieci internal.
  # llm:
  #   image: <obraz>@sha256:<digest>
  #   profiles: [llm]
  #   tty: false
  #   stdin_open: false
  #   cap_drop: [ALL]
  #   logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  #   security_opt: ["no-new-privileges:true"]
  #   read_only: true
  #   networks: [backend]

networks:
  frontend: {}
  backend:
    internal: true
