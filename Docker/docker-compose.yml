# Uruchomienie z korzenia repo: docker compose --env-file .env -f Docker/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: formforge:0.0.1
    user: "10001:10001"
    environment:
      # Wybierz eden albo local. W obu trybach model to Qwen3.5-9B.
      AI_PROVIDER: ${AI_PROVIDER:-eden}
      EDENAI_MODEL: ${EDENAI_MODEL:-ionos/Qwen/Qwen3.5-9B}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen3.5:9b}
      EDENAI_BASE_URL: http://gateway:8081/v3
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,uid=10001,gid=10001
    # Brak interaktywnego dostępu do kontenera
    tty: false
    stdin_open: false
    # Wszystkie capabilities usunięte; bez cap_add (port 8080 > 1024 nie wymaga NET_BIND_SERVICE)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    init: true
    restart: unless-stopped
    # Limit logów (ochrona przed "logging bomb"): max 3 pliki x 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [backend]
    depends_on:
      gateway:
        condition: service_started

  # API Gateway: jedyny kontener z dostępem do internetu i jedyny z kluczem Eden
  gateway:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      EDENAI_API_KEY: ${EDENAI_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    tty: false
    stdin_open: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.29.250.0/24
