# Lokalny runtime Qwen3.5-9B.
# Uruchamiaj razem z docker-compose.yml: docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.local.yml up
services:
  app:
    environment:
      AI_PROVIDER: local
      LOCAL_AI_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    networks: [backend, ollama-egress]
    restart: unless-stopped
    mem_limit: 12g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ollama-models: {}

networks:
  ollama-egress: {}
